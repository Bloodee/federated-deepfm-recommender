[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-deepfm-recommender"
version = "1.0.0"
description = "Multi-stage movie recommendation with local hybrid recall and horizontal federated DeepFM"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "MIT"}
authors = [{name = "Riac"}]
dependencies = [
  "numpy==1.23.5",
  "pandas==1.5.3"
]

[project.optional-dependencies]
federated = [
  "tensorflow==2.12.0",
  "secretflow==1.11.0b1",
  "secretflow_fl==1.11.0b1"
]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

